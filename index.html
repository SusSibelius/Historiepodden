<!doctype html><html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pinpoint – Historiska personer</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><div class="brand"><span class="logo">●</span> HISTORIEPODDEN PINPOINT</div><div class="stats"><button id="runLabel" class="round-button" type="button">Runda 1</button><span class="high-score-label">High-score <b id="highScore">0</b></span><div id="historyPanel" class="history-panel hidden"><div class="history-title">Tidigare rätta gissningar</div><div id="historyList" class="history-list"><div class="history-empty">Inga rätta gissningar ännu.</div></div></div></div></header>
<main><section class="intro"><p class="eyebrow">ORAKLET FRÅN RINGARUM</p><h1>Vem föddes här och dog där?</h1><p class="sub">Två platser. Ett namn. En gissning.</p></section>
<div id="map"><div id="mapWorld" class="map-world"></div>
<div id="birthPin" class="pin-marker birth"><div class="map-pin"><span></span></div><span id="birthYear" class="pin-year"></span></div>
<div id="deathPin" class="pin-marker death"><div class="map-pin"><span></span></div><span id="deathYear" class="pin-year"></span></div>
<section class="guess-area"><div class="run-status"><b id="runStatus">Pågående</b> · En gissning</div><form id="guessForm"><label for="guess">Vem tror du att det är?</label><div class="input-row"><input id="guess" autocomplete="off" placeholder="Skriv personens namn…" required><button type="submit">Gissa</button></div></form><div class="actions"><button id="lifelineBtn" class="lifeline">♡ Livlina</button><span id="lifelineText">1 livlina kvar</span></div><div id="result" class="result hidden"></div><button id="nextBtn" class="next hidden">Nästa →</button></section>
</div></div></main><script src="people.js"></script><script src="app.js"></script></body></html>
